<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Browser Automation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.8;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-label {
      font-size: 13px;
      opacity: 0.9;
    }

    .status-value {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
    }

    .status-value.connected {
      background: rgba(52, 211, 153, 0.3);
    }

    .status-value.disconnected {
      background: rgba(239, 68, 68, 0.3);
    }

    .toggle-section {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .toggle-row:last-child {
      margin-bottom: 0;
    }

    .toggle-label {
      font-size: 13px;
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .toggle-switch.active {
      background: rgba(52, 211, 153, 0.5);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.3s;
    }

    .toggle-switch.active::after {
      transform: translateX(20px);
    }

    .server-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 12px;
      margin-bottom: 12px;
      outline: none;
    }

    .server-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .btn-primary {
      background: white;
      color: #667eea;
      margin-bottom: 8px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .info {
      text-align: center;
      font-size: 11px;
      opacity: 0.6;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎙️ AI Voice Control</h1>
    <p>Browser Automation Assistant</p>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Backend</span>
      <span class="status-value" id="connection-status">Checking...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Status</span>
      <span class="status-value" id="mode-status">Idle</span>
    </div>
  </div>

  <div class="toggle-section">
    <div class="toggle-row">
      <span class="toggle-label">User Confirmation</span>
      <div class="toggle-switch active" id="toggle-confirmation"></div>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Auto Mode</span>
      <div class="toggle-switch" id="toggle-auto"></div>
    </div>
  </div>

  <input type="text" class="server-input" id="server-url" placeholder="ws://localhost:3001" value="ws://localhost:3001">

  <button class="btn btn-primary" id="btn-connect">Connect to Backend</button>
  <button class="btn btn-secondary" id="btn-open-frontend">Open Dashboard</button>

    <div class="info">
      Use the web dashboard for voice commands<br>
      <small style="opacity: 0.5;">For HF Spaces: wss://space-name-user.hf.space</small>
    </div>

  <script src="popup.js"></script>
</body>
</html>
